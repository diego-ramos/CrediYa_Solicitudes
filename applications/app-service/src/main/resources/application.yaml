server:
  port: 8081
spring:
  application:
    name: "CrediYa_Applications"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: my-super-secret-key-change-me-123456
adapters:
  mariadb:
    database: ${DB_NAME:crediya_applications}
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:3306}
    username: ${DB_USER:crediya_user}
    password: ${DB_PASSWORD:crediya123}
    pool:
      initial-size: 12
      max-size: 15
      max-idle-time: 10
adapter:
  restconsumer:
    timeout: 5000
    url: "http://localhost:8080"
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
logging:
  level:
    io.r2dbc.postgresql.client.ReactorNettyClient: DEBUG
    org.springframework.r2dbc.core: DEBUG